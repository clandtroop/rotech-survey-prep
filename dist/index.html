    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Source Sans 3', system-ui, sans-serif;
      background: #f6f8fa;
      color: #131922;
      -webkit-font-smoothing: antialiased;
    }
    /* Placeholders sit on white cards now that the meta fields moved off the
       blue header band — the old translucent-white value was invisible there. */
    ::placeholder { color: #9ba5b2; opacity: 1; }
    a { color: #0053a1; }
    a:hover { color: #003a70; }

    /* One visible focus ring for every interactive control. :focus-visible
       keeps it off mouse clicks but guarantees it for keyboard users. */
    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    a:focus-visible,
    [tabindex]:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(0,83,161,.30);
      border-color: #0053a1;
    }
    /* On the blue header the blue ring disappears — invert it there. */
    .app-header button:focus-visible,
    .app-header select:focus-visible,
    .app-header input:focus-visible {
      box-shadow: 0 0 0 3px rgba(255,255,255,.55);
      border-color: transparent;
