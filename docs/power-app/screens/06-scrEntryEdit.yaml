                                              Control: ModernText@1.0.0
                                              Properties:
                                                Text: ="Arrival time"
                                                Size: =11
                                                Color: =RGBA(93, 103, 115, 1)
                                                FontWeight: =FontWeight.Semibold
                                                FillPortions: =0
                                                Height: =18
                                                AlignInContainer: =AlignInContainer.Stretch
                                          - eedRetArr:
                                              Control: ModernTextInput@1.0.0
                                              Properties:
                                                Appearance: =Appearance.Outline
                                                TriggerOutput: =TriggerOutput.Keypress
                                                Default: =IfError(Text(ParseJSON(Coalesce(varEntry.TravelJson, "{}")).flight.returnFlight.arriveTime), "")
                                                FillPortions: =0
                                                Height: =36
                                                AlignInContainer: =AlignInContainer.Stretch
                              - eedTRow10:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    DropShadow: =DropShadow.None
                                    LayoutAlignItems: =LayoutAlignItems.Start
                                    LayoutGap: =12
                                    FillPortions: =0
                                    Height: =64
                                    AlignInContainer: =AlignInContainer.Stretch
                                  Children:
                                    - eedFlightNotesField:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutDirection: =LayoutDirection.Vertical
                                          DropShadow: =DropShadow.None
                                          LayoutGap: =4
                                          FillPortions: =1
                                          LayoutMinHeight: =60
                                          LayoutMinWidth: =40
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Height: =62
                                        Children:
                                          - eedFlightNotesFieldLbl:
                                              Control: ModernText@1.0.0
                                              Properties:
                                                Text: ="Flight notes"
                                                Size: =11
                                                Color: =RGBA(93, 103, 115, 1)
                                                FontWeight: =FontWeight.Semibold
                                                FillPortions: =0
                                                Height: =18
                                                AlignInContainer: =AlignInContainer.Stretch
                                          - eedFlightNotes:
                                              Control: ModernTextInput@1.0.0
                                              Properties:
                                                Appearance: =Appearance.Outline
                                                TriggerOutput: =TriggerOutput.Keypress
                                                Default: =IfError(Text(ParseJSON(Coalesce(varEntry.TravelJson, "{}")).flight.notes), "")
                                                FillPortions: =0
                                                Height: =36
                                                AlignInContainer: =AlignInContainer.Stretch
                  - eedFooter:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        DropShadow: =DropShadow.None
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        FillPortions: =0
                        Height: =44
                        AlignInContainer: =AlignInContainer.Stretch
                      Children:
                        - eedDelete:
                            Control: ModernButton@1.0.0
                            Properties:
                              Text: ="Delete"
                              OnSelect: |-
                                =If(Confirm("Delete " & varEntry.PersonName & "'s entry for " & If(IsBlank(varEntry.EndDate) || varEntry.EndDate = varEntry.StartDate, Text(varEntry.StartDate, "mmm d"), Month(varEntry.StartDate) = Month(varEntry.EndDate) && Year(varEntry.StartDate) = Year(varEntry.EndDate), Text(varEntry.StartDate, "mmm d") & " – " & Day(varEntry.EndDate), Text(varEntry.StartDate, "mmm d") & " – " & Text(varEntry.EndDate, "mmm d")) & "?"),
                                  Remove('TP Entries', varEntry);
                                  Set(varEntry, Blank());
                                  Navigate(scrWhereabouts, ScreenTransition.None)
                                )
                              Size: =13
                              FillPortions: =0
                              Width: =96
                              Height: =36
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Outline
                              Icon: ="Delete"
                              BasePaletteColor: =RGBA(192, 57, 43, 1)
                              Visible: =!IsBlank(varEntry) && (varIsAdmin || (!IsBlank(varMe) && varEntry.PersonKey = varMe.PersonKey))
                        - eedFootSpacer:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: =""
                              Size: =13
                              Color: =RGBA(19, 25, 34, 1)
                              FillPortions: =1
                              LayoutMinWidth: =1
                              Height: =10
                              AlignInContainer: =AlignInContainer.Center
                        - eedCancel:
                            Control: ModernButton@1.0.0
                            Properties:
                              Text: ="Cancel"
                              OnSelect: =Back()
                              Size: =13
                              FillPortions: =0
                              Width: =90
                              Height: =36
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Outline
                        - eedSave:
                            Control: ModernButton@1.0.0
                            Properties:
                              Text: ="Save entry"
                              OnSelect: |-
                                =With(
                                  {
                                    sd: eedStart.SelectedDate,
                                    ed: Coalesce(eedEnd.SelectedDate, eedStart.SelectedDate),
                                    who: If(varIsAdmin, eedPerson.Selected, LookUp(colPeople, PersonKey = Coalesce(varEntry.PersonKey, varMe.PersonKey))),
                                    st: eedStatus.Selected.Label
                                  },
                                  If(
                                    IsBlank(sd) || IsBlank(who), Notify("Pick a person and a start date.", NotificationType.Error),
                                    ed < sd, Notify("End date can't be before the start date.", NotificationType.Error),
                                    IfError(
                                      Set(varEntry, Patch('TP Entries', If(IsBlank(varEntry), Defaults('TP Entries'), varEntry), {
                                        Title: who.Title & " · " & st & If(st = "Site Visit" && !IsBlank(eedLocation.Text), " · " & eedLocation.Text, ""),
                                        PersonKey: who.PersonKey,
                                        PersonName: who.Title,
                                        OwnerEmail: Lower(who.Person.Email),
                                        StartDate: sd,
                                        EndDate: ed,
                                        StartNum: Value(Text(sd, "yyyymmdd")),
                                        EndNum: Value(Text(ed, "yyyymmdd")),
                                        DayPart: {Value: If(sd = ed, eedPart.Selected.Value, "Full day")},
                                        Status: {Value: st},
                                        Notes: eedNotes.Text,
                                        VisitLocation: eedLocation.Text,
                                        VisitPurpose: eedPurpose.Text,
                                        VisitTime: eedTime.Text,
                                        VisitMode: If(st = "Site Visit", {Value: eedMode.Selected.Value}, Blank()),
                                        VisitConfirmation: If(st = "Site Visit", {Value: eedConfirm.Selected.Value}, Blank()),
                                        TravelJson: With(
                                    {tr: {
                                      hotel: {name: eedHotelName.Text, confirmation: eedHotelConf.Text, checkIn: If(IsBlank(eedHotelIn.SelectedDate), "", Text(eedHotelIn.SelectedDate, "yyyy-mm-dd")), checkOut: If(IsBlank(eedHotelOut.SelectedDate), "", Text(eedHotelOut.SelectedDate, "yyyy-mm-dd")), phone: eedHotelPhone.Text, notes: eedHotelNotes.Text},
                                      flight: {airline: eedOutAirline.Text, confirmation: eedOutConf.Text, departAirport: eedOutFrom.Text, departTime: eedOutDep.Text, arriveAirport: eedOutTo.Text, arriveTime: eedOutArr.Text, notes: eedFlightNotes.Text,
                                        returnFlight: {airline: eedRetAirline.Text, confirmation: eedRetConf.Text, departAirport: eedRetFrom.Text, departTime: eedRetDep.Text, arriveAirport: eedRetTo.Text, arriveTime: eedRetArr.Text}}
                                    }},
                                    If(Len(eedHotelName.Text & eedHotelConf.Text & eedHotelPhone.Text & eedHotelNotes.Text & eedOutAirline.Text & eedOutConf.Text & eedOutFrom.Text & eedOutDep.Text & eedOutTo.Text & eedOutArr.Text & eedRetAirline.Text & eedRetConf.Text & eedRetFrom.Text & eedRetDep.Text & eedRetTo.Text & eedRetArr.Text & eedFlightNotes.Text & If(IsBlank(eedHotelIn.SelectedDate), "", Text(eedHotelIn.SelectedDate, "yyyy-mm-dd")) & If(IsBlank(eedHotelOut.SelectedDate), "", Text(eedHotelOut.SelectedDate, "yyyy-mm-dd"))) = 0, "", JSON(tr, JSONFormat.Compact))
                                  )
                                      }));
                                      Set(varAnchor, Date(Year(sd), Month(sd), 1));
                                      Notify("Entry saved", NotificationType.Success);
                                      Navigate(scrWhereabouts, ScreenTransition.None),
                                      Notify("Couldn't save: " & FirstError.Message, NotificationType.Error)
                                    )
                                  )
                                )
                              Size: =13
                              FillPortions: =0
                              Width: =110
                              Height: =36
                              AlignInContainer: =AlignInContainer.Center
